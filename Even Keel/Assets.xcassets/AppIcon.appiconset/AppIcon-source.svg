<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source master for the default app icon. Keep the main mark inside the 184 px safe margin. -->
  <defs>
    <linearGradient id="background" x1="160" y1="112" x2="864" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F5F9"/>
      <stop offset="1" stop-color="#E7F6F2"/>
    </linearGradient>
    <linearGradient id="left" x1="242" y1="255" x2="555" y2="728" gradientUnits="userSpaceOnUse">
      <stop stop-color="#159785"/>
      <stop offset="1" stop-color="#107F6E"/>
    </linearGradient>
    <linearGradient id="right" x1="466" y1="297" x2="791" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4BBE92"/>
      <stop offset="1" stop-color="#2B7E5A"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <!-- Two overlapping planning cards: one budget, held together. -->
  <rect x="204" y="254" width="402" height="516" rx="136" fill="url(#left)"/>
  <rect x="418" y="254" width="402" height="516" rx="136" fill="url(#right)"/>
  <!-- The shared seam keeps the pair legible at small sizes. -->
  <path d="M512 348v328" stroke="#F4F5F9" stroke-width="26" stroke-linecap="round" opacity=".94"/>
  <!-- Deliberately currency-neutral ledger rows. -->
  <path d="M300 434h116M300 512h92M300 590h116M608 434h116M632 512h92M608 590h116" stroke="#F4F5F9" stroke-width="30" stroke-linecap="round" opacity=".94"/>
  <!-- One total that joins both columns. -->
  <rect x="412" y="666" width="200" height="52" rx="26" fill="#F4F5F9" opacity=".94"/>
</svg>
