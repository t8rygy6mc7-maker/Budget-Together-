<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Together — design prototype</title>
<style>
:root{
  --screen:#141620; --card:#1D2130; --cardBorder:#2A3042; --cardBorderSoft:#23283A;
  --navBar:#181B27; --navBorder:#262B3A; --sheetBg:#1A1D29; --field:#141620; --chip:#232838;
  --text:#EDEFF7; --sub:#9AA0B6; --muted:#777F9D; --label9:#9AA0B6;
  --teal:#5EEAD4; --tealInk:#0C2B26; --purple:#C69BFF; --purpleInk:#2A1740;
  --drift:#F5A623; --over:#F2555A;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0B0C12;color:var(--text);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex;justify-content:center;align-items:flex-start;gap:32px;padding:32px 20px;flex-wrap:wrap}
.phone{width:372px;flex:0 0 372px;background:var(--screen);border-radius:34px;border:1px solid #23262F;
  height:812px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.scroll{flex:1;overflow-y:auto;padding:22px 22px 96px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
h1{font-size:21px;font-weight:600;letter-spacing:-.2px}
.sub{font-size:13px;color:var(--sub)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--cardBorder);border-radius:18px}
.card.soft{border-color:var(--cardBorderSoft);border-radius:15px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between}
.track{position:relative;background:var(--field);border-radius:5px;height:10px}
.fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px}
.tail{position:absolute;top:0;bottom:0;right:0;background:var(--over);border-radius:0 5px 5px 0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500}
.badge.drift{color:var(--drift)} .badge.over{color:var(--over)} .badge.ok{color:var(--sub)}
.glyph{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.nav{background:var(--navBar);border-top:1px solid var(--navBorder);display:flex;padding:9px 20px 12px;position:relative}
.nav button{flex:1;background:none;border:0;color:var(--muted);font:600 9.5px/1.4 inherit;display:grid;gap:4px;
  justify-items:center;cursor:pointer;padding:4px 0}
.nav button.on{color:var(--teal)}
.nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.fab{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:56px;height:56px;border:0;border-radius:18px;
  background:linear-gradient(135deg,var(--teal),#3FB984);color:var(--tealInk);font-size:28px;font-weight:600;
  cursor:pointer;box-shadow:0 10px 22px rgba(94,234,212,.35)}
.sheet{position:absolute;inset:0;background:rgba(6,7,11,.62);display:none;align-items:flex-end;z-index:5}
.sheet.open{display:flex}
.sheetInner{background:var(--sheetBg);border-radius:22px 22px 0 0;padding:22px;width:100%;border-top:1px solid var(--cardBorder)}
input,select{width:100%;background:var(--field);border:1px solid var(--cardBorder);border-radius:11px;color:var(--text);
  font:400 15px/1 inherit;padding:11px 12px;font-family:var(--mono)}
label{display:block;font-size:11.5px;color:var(--sub);margin:0 0 6px;font-family:inherit}
.seg{display:flex;gap:8px}
.seg button{flex:1;background:var(--field);border:1px solid var(--cardBorder);color:var(--sub);border-radius:11px;
  padding:10px;font:500 13px inherit;cursor:pointer}
.seg button.on{border-color:transparent}
.primary{width:100%;margin-top:16px;background:linear-gradient(135deg,var(--teal),#3FB984);color:var(--tealInk);
  border:0;border-radius:14px;padding:14px;font:600 15px inherit;cursor:pointer}
.ghost{width:100%;margin-top:8px;background:none;border:0;color:var(--muted);padding:8px;font:500 13px inherit;cursor:pointer}
.panel{flex:0 0 300px;max-width:340px}
.panel h2{font-size:15px;font-weight:600;margin-bottom:4px}
.panel p{font-size:12.5px;color:var(--sub);line-height:1.6}
.panel section{background:#12141C;border:1px solid #1F222C;border-radius:14px;padding:15px;margin-bottom:12px}
.panel label{font-size:12px;color:var(--sub);margin-bottom:8px}
input[type=range]{padding:0;border:0;background:none;accent-color:#5EEAD4}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid #1B1E27}
.kv:last-child{border:0}
.kv span:last-child{font-family:var(--mono)}
.switch{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--sub);cursor:pointer;line-height:1.5}
.switch input{width:auto;flex:none;margin-top:2px}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px;margin-top:14px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:1px}
.stack{display:flex;gap:2px;height:32px}
.stack div{display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap}
.stack div:first-child{border-radius:4px 0 0 4px} .stack div:last-child{border-radius:0 4px 4px 0}
.hero{font-family:var(--mono);font-size:33px;font-weight:600;letter-spacing:-1px}
.dayblocks{display:flex;gap:3px;margin-top:12px}
.dayblocks div{flex:1;height:24px;border-radius:3px;background:var(--field);border:1px solid var(--cardBorderSoft)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:26px 0}
</style>
</head>
<body>

<div class="phone">
  <div class="scroll" id="view"></div>
  <div class="nav" id="nav"></div>
  <div class="sheet" id="sheet"><div class="sheetInner" id="sheetInner"></div></div>
</div>

<div class="panel">
  <section>
    <h2>Simulation controls</h2>
    <p>Scrub the day to watch the pace cues fire. This is the harness for testing thresholds, not a shipping feature.</p>
  </section>
  <section>
    <label>Day of month — <b id="dayOut">25</b> of 31</label>
    <input type="range" id="day" min="1" max="31" step="1" value="25">
    <div class="hint" id="dayHint"></div>
  </section>
  <section>
    <label>Pace rules</label>
    <label class="switch"><input type="checkbox" id="excludeFixed" checked>
      Exclude fixed buckets from month pace<br><span style="color:var(--muted)">Rent on day 1 otherwise makes every month read "ahead"</span></label>
    <label class="switch" style="margin-top:10px"><input type="checkbox" id="guards" checked>
      Early-month guards (day ≥ 5 and ≥ 8% of cap)</label>
    <label class="switch" style="margin-top:10px"><input type="checkbox" id="oldCues">
      Use the current cues (clamped bars, no pace tick)</label>
  </section>
  <section>
    <label>Computed state</label>
    <div id="readout"></div>
  </section>
  <section>
    <label>Data</label>
    <button class="ghost" style="text-align:left" id="reseed">Reseed the month with different spending</button>
    <button class="ghost" style="text-align:left" id="blowout">Make it a blowout month</button>
    <button class="ghost" style="text-align:left" id="frugal">Make it a frugal month</button>
  </section>
</div>

<script>
var BUCKETS = [
  {id:'housing',  label:'Housing',       hex:'#E86A4A', ini:'Ho', cadence:'fixed'},
  {id:'food',     label:'Food and drink',hex:'#3FB984', ini:'Fo', cadence:'variable'},
  {id:'transport',label:'Transport',     hex:'#5B8DEF', ini:'Tr', cadence:'variable'},
  {id:'fun',      label:'Fun and misc',  hex:'#D45C87', ini:'Fu', cadence:'variable'},
  {id:'shopping', label:'Shopping',      hex:'#E0C05B', ini:'Sh', cadence:'variable'},
  {id:'personal', label:'Health',        hex:'#F6A5C8', ini:'He', cadence:'variable'},
  {id:'subs',     label:'Subscriptions', hex:'#C69BFF', ini:'Su', cadence:'fixed'},
  {id:'savings',  label:'Savings',       hex:'#5EEAD4', ini:'Sa', cadence:'fixed'}
];
var CAPS = {housing:1300,food:500,transport:250,fun:200,shopping:250,personal:150,subs:60,savings:400};
var DIM = 31, MONTH = 'July 2026';
var PLACES = {
  food:['Pomodoro','Blue Bottle','Trader Joes','Sweetgreen','Tacos El Rey','Corner deli'],
  transport:['Shell','BART','Lyft','Parking','Chevron'],
  fun:['Alamo Drafthouse','Bar Basso','Bandcamp','Bouldering gym'],
  shopping:['Uniqlo','Muji','Ace Hardware','Bookshop'],
  personal:['Walgreens','Dentist','Yoga studio'],
  housing:['Rent'],subs:['Spotify','iCloud'],savings:['Transfer to savings']
};

var state = {tab:'home', day:25, entries:[], sheet:false,
             draft:{amount:'',place:'',bucket:'food',person:'you'}};

function rng(seed){return function(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff}}
function money(n){return '$'+Math.round(n).toLocaleString()}
function money2(n){return '$'+n.toFixed(2)}
function bucket(id){for(var i=0;i<BUCKETS.length;i++)if(BUCKETS[i].id===id)return BUCKETS[i];return BUCKETS[0]}

function seed(profile,s){
  var r = rng(s||7), out = [], id = 0;
  out.push({id:++id,day:1,place:'Rent',bucket:'housing',amount:1300,person:'you'});
  out.push({id:++id,day:2,place:'Transfer to savings',bucket:'savings',amount:400,person:'you'});
  out.push({id:++id,day:3,place:'Spotify',bucket:'subs',amount:17.99,person:'friend'});
  out.push({id:++id,day:3,place:'iCloud',bucket:'subs',amount:2.99,person:'you'});
  var scale = profile==='blowout' ? 2.0 : profile==='frugal' ? 0.7 : 1.3;
  var vary = ['food','food','food','transport','fun','shopping','personal'];
  for(var d=1;d<=DIM;d++){
    var n = Math.floor(r()*2.4);
    for(var k=0;k<n;k++){
      var b = vary[Math.floor(r()*vary.length)];
      var base = b==='food'?26:b==='transport'?38:b==='fun'?42:b==='shopping'?58:34;
      var amt = Math.round((base*(0.5+r()*1.4)*scale)*100)/100;
      var pl = PLACES[b][Math.floor(r()*PLACES[b].length)];
      out.push({id:++id,day:d,place:pl,bucket:b,amount:amt,person:r()>0.45?'you':'friend'});
    }
  }
  if(profile==='blowout') out.push({id:++id,day:12,place:'Ace Hardware',bucket:'housing',amount:180,person:'friend'});
  return out;
}

function live(){var d=state.day;return state.entries.filter(function(e){return e.day<=d})}
function totals(){
  var t={};live().forEach(function(e){t[e.bucket]=(t[e.bucket]||0)+e.amount});return t;
}
function spent(){var s=0;live().forEach(function(e){s+=e.amount});return s}
function spentBy(p){var s=0;live().forEach(function(e){if(e.person===p)s+=e.amount});return s}
function capTotal(){var s=0;for(var k in CAPS)s+=CAPS[k];return s}
function ranked(){
  var t=totals(),out=[];
  BUCKETS.forEach(function(b){if(t[b.id]>0)out.push({b:b,total:t[b.id]})});
  out.sort(function(x,y){return y.total-x.total});return out;
}

function paceState(sp,cap,cadence){
  if(cap<=0) return {kind:'none'};
  if(sp>cap) return {kind:'over',by:sp-cap};
  if(cadence==='fixed') return {kind:'none'};
  var guards = document.getElementById('guards').checked;
  if(guards && !(state.day>=5 && sp>=cap*0.08)) return {kind:'quiet'};
  var expected = cap*state.day/DIM;
  var ratio = sp/expected;
  if(ratio>1.25) return {kind:'drift',pct:Math.round((ratio-1)*100)};
  return {kind:'ok'};
}
function monthPace(){
  var ex = document.getElementById('excludeFixed').checked;
  var t = totals(), sp=0, cap=0;
  BUCKETS.forEach(function(b){
    if(ex && b.cadence==='fixed') return;
    sp += (t[b.id]||0); cap += CAPS[b.id];
  });
  return {spent:sp, cap:cap, state:paceState(sp,cap,'variable'),
          projected: state.day>0 ? sp/state.day*DIM : 0};
}
function badge(st){
  if(st.kind==='over') return '<span class="badge over">▲ Over by '+money(st.by)+'</span>';
  if(st.kind==='drift') return '<span class="badge drift">▲ '+st.pct+'% ahead of pace</span>';
  if(st.kind==='ok') return '<span class="badge ok">On pace</span>';
  return '<span class="badge ok" style="color:var(--muted)">—</span>';
}
function bar(sp,cap,hex,cadence,h){
  h = h||10;
  var old = document.getElementById('oldCues').checked;
  var pct = cap>0 ? Math.min(100,sp/cap*100) : 0;
  if(old){
    var over = cap>0 && sp>cap;
    return '<div class="track" style="height:'+h+'px"><div class="fill" style="width:'+pct+'%;background:'+
      (over?'#E86A4A':hex)+'"></div></div>';
  }
  var tickPct = cadence==='fixed' ? null : state.day/DIM*100;
  if(cap>0 && sp>cap){
    var w = cap/sp*100;
    return '<div class="track" style="height:'+h+'px">'+
      '<div class="fill" style="width:'+w+'%;background:'+hex+';border-radius:'+(h/2)+'px 0 0 '+(h/2)+'px"></div>'+
      '<div class="tail" style="left:'+w+'%"></div>'+
      '<div class="tick" style="left:'+w+'%"></div></div>';
  }
  return '<div class="track" style="height:'+h+'px">'+
    '<div class="fill" style="width:'+pct+'%;background:'+hex+'"></div>'+
    (tickPct!==null?'<div class="tick" style="left:'+Math.min(100,tickPct)+'%"></div>':'')+'</div>';
}
function glyph(b,size){
  size = size||32;
  return '<div class="glyph" style="width:'+size+'px;height:'+size+'px;background:'+b.hex+'29;color:'+b.hex+'">'+b.ini+'</div>';
}

function home(){
  var mp = monthPace(), t = totals(), sp = spent(), cap = capTotal();
  var left = Math.max(0,cap-sp), daysLeft = Math.max(1,DIM-state.day);
  var attention = [];
  BUCKETS.forEach(function(b){
    var st = paceState(t[b.id]||0, CAPS[b.id], b.cadence);
    if(st.kind==='over'||st.kind==='drift') attention.push({b:b,st:st,total:t[b.id]||0});
  });
  attention.sort(function(x,y){return (x.st.kind==='over'?0:1)-(y.st.kind==='over'?0:1)});
  var recent = live().slice().sort(function(a,b){return b.day-a.day||b.id-a.id}).slice(0,3);

  var h = '<div class="between" style="align-items:flex-start;margin-bottom:20px">'+
    '<div><h1>Together</h1><div class="sub">'+MONTH+'</div></div>'+
    '<div style="display:flex">'+
      '<div class="glyph" style="width:29px;height:29px;border-radius:50%;background:var(--teal);color:var(--tealInk);border:2px solid var(--screen)">Y</div>'+
      '<div class="glyph" style="width:29px;height:29px;border-radius:50%;background:var(--purple);color:var(--purpleInk);border:2px solid var(--screen);margin-left:-9px">F</div>'+
    '</div></div>';

  h += '<div class="card" style="padding:15px;margin-bottom:10px">'+
    '<div class="between" style="margin-bottom:3px"><span class="sub" style="font-size:12px">Spent this month</span>'+
      badge(mp.state)+'</div>'+
    '<div style="display:flex;align-items:baseline;gap:7px;margin-bottom:13px">'+
      '<span class="hero">'+money(sp)+'</span><span class="sub" style="color:var(--muted)">of '+money(cap)+'</span></div>'+
    bar(mp.spent,mp.cap,mp.state.kind==='drift'?'var(--drift)':'var(--teal)','variable')+
    '<div class="between" style="margin-top:9px;font-size:11.5px;color:var(--muted)">'+
      '<span>pace, day '+state.day+' of '+DIM+'</span>'+
      '<span>projected '+money(mp.projected + (document.getElementById('excludeFixed').checked ? sp-mp.spent : 0))+'</span></div>'+
    '</div>';

  h += '<div class="card" style="padding:15px;margin-bottom:22px">'+
    '<div class="sub" style="font-size:12px;margin-bottom:1px">Safe to spend today</div>'+
    '<div style="display:flex;align-items:baseline;gap:9px">'+
      '<span class="mono" style="font-size:27px;font-weight:600;color:var(--teal)">'+money(left/daysLeft)+'</span>'+
      '<span class="sub" style="font-size:12px;color:var(--muted)">'+money(left)+' left · '+daysLeft+' days</span></div>'+
    '</div>';

  if(attention.length){
    h += '<div style="font-size:13.5px;font-weight:600;margin-bottom:10px">Needs attention</div>';
    attention.forEach(function(a){
      h += '<div class="card soft" style="padding:12px 13px;margin-bottom:8px">'+
        '<div class="row" style="margin-bottom:9px">'+glyph(a.b,26)+
          '<span style="font-size:13px;font-weight:600">'+a.b.label+'</span>'+
          '<span class="mono" style="margin-left:auto;font-size:12.5px">'+money(a.total)+'</span>'+
          '<span class="sub" style="font-size:12px;color:var(--muted)">/ '+money(CAPS[a.b.id])+'</span></div>'+
        bar(a.total,CAPS[a.b.id],a.b.hex,a.b.cadence,8)+
        '<div style="margin-top:8px">'+badge(a.st)+'</div></div>';
    });
    h += '<div style="height:14px"></div>';
  } else {
    h += '<div class="card soft" style="padding:16px;margin-bottom:22px;text-align:center">'+
      '<div class="badge ok" style="color:var(--teal)">Every category is on pace</div></div>';
  }

  h += '<div class="between" style="margin-bottom:10px"><span style="font-size:13.5px;font-weight:600">Recent</span>'+
    '<span style="font-size:12px;color:var(--teal)">See all</span></div>';
  if(!recent.length) h += '<div class="empty">Nothing logged yet — tap + to add one.</div>';
  recent.forEach(function(e){h += entryRow(e)});
  return h;
}

function entryRow(e,del){
  var b = bucket(e.bucket);
  return '<div class="card soft" style="padding:10px 12px;margin-bottom:7px">'+
    '<div class="row">'+glyph(b,30)+
    '<div style="min-width:0"><div style="font-size:13px;font-weight:600">'+e.place+'</div>'+
    '<div class="sub" style="font-size:11.5px">'+b.label+'</div></div>'+
    '<div style="margin-left:auto;display:flex;align-items:center;gap:9px">'+
      '<span style="width:7px;height:7px;border-radius:50%;background:'+(e.person==='you'?'var(--teal)':'var(--purple)')+'"></span>'+
      '<span class="mono" style="font-size:13px">'+money2(e.amount)+'</span>'+
      (del?'<button onclick="del('+e.id+')" style="background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px">✕</button>':'')+
    '</div></div></div>';
}

function log(){
  var es = live().slice().sort(function(a,b){return b.day-a.day||b.id-a.id});
  var h = '<h1>Daily log</h1><div class="sub" style="margin-bottom:18px">'+MONTH+' · '+es.length+
    (es.length===1?' entry':' entries')+'</div>';
  if(!es.length) return h+'<div class="empty">Nothing logged yet.</div>';
  var byDay = {}, order = [];
  es.forEach(function(e){if(!byDay[e.day]){byDay[e.day]=[];order.push(e.day)}byDay[e.day].push(e)});
  order.forEach(function(d){
    var tot = byDay[d].reduce(function(s,e){return s+e.amount},0);
    h += '<div style="margin-bottom:18px"><div class="between" style="margin-bottom:8px">'+
      '<span style="font-size:12.5px;font-weight:600;color:var(--label9)">'+(d===state.day?'Today':'July '+d)+'</span>'+
      '<span class="mono sub" style="font-size:12.5px">'+money2(tot)+'</span></div>';
    byDay[d].forEach(function(e){h += entryRow(e,true)});
    h += '</div>';
  });
  return h;
}

function budget(){
  var t = totals(), sp = spent(), cap = capTotal(), mp = monthPace();
  var h = '<h1>Budget</h1><div class="sub" style="margin-bottom:16px">Caps for '+MONTH+'</div>';
  h += '<div class="card" style="padding:15px;margin-bottom:16px">'+
    '<div class="between" style="margin-bottom:10px"><span class="sub" style="font-size:12.5px">Planned total</span>'+
    '<span class="mono" style="font-size:17px;font-weight:600">'+money(cap)+'</span></div>'+
    bar(mp.spent,mp.cap,'var(--teal)','variable')+
    '<div class="between" style="margin-top:10px;font-size:12.5px">'+
    '<span style="color:var(--teal);font-weight:600">'+money(sp)+' spent</span>'+
    '<span class="sub">'+money(Math.max(0,cap-sp))+' left</span></div></div>';
  BUCKETS.forEach(function(b){
    var a = t[b.id]||0, st = paceState(a,CAPS[b.id],b.cadence);
    h += '<div class="card soft" style="padding:12px 14px;margin-bottom:9px">'+
      '<div class="row" style="margin-bottom:9px">'+glyph(b,30)+
      '<span style="font-size:13.5px;font-weight:600">'+b.label+'</span>'+
      (b.cadence==='fixed'?'<span class="sub" style="font-size:10.5px;color:var(--muted);border:1px solid var(--cardBorder);border-radius:5px;padding:1px 5px">fixed</span>':'')+
      '<span class="mono" style="margin-left:auto;font-size:13px">'+money(a)+'</span>'+
      '<span class="sub" style="font-size:12px;color:var(--muted)">/ '+money(CAPS[b.id])+'</span></div>'+
      bar(a,CAPS[b.id],b.hex,b.cadence,8)+
      '<div style="margin-top:8px">'+badge(st)+'</div></div>';
  });
  return h;
}

function stats(){
  var r = ranked(), sp = spent(), you = spentBy('you'), fr = spentBy('friend');
  var h = '<h1>Stats</h1><div class="sub" style="margin-bottom:16px">'+MONTH+'</div>';
  if(!r.length) return h+'<div class="empty">Nothing to chart yet.</div>';
  var big = [], other = 0, otherN = 0;
  r.forEach(function(x){ if(x.total/sp >= 0.05) big.push(x); else {other += x.total; otherN++} });
  h += '<div class="card" style="padding:15px;margin-bottom:16px">'+
    '<div class="sub" style="font-size:12px;margin-bottom:12px">Where it went</div><div class="stack">';
  big.forEach(function(x){
    var pct = x.total/sp*100;
    h += '<div style="width:'+pct+'%;background:'+x.b.hex+';color:#12141C">'+(pct>13?x.b.label.split(' ')[0]+' '+Math.round(pct)+'%':(pct>7?Math.round(pct)+'%':''))+'</div>';
  });
  if(other>0) h += '<div style="width:'+(other/sp*100)+'%;background:#565C72"></div>';
  h += '</div><div class="legend">';
  big.forEach(function(x){
    h += '<span><i style="background:'+x.b.hex+'"></i>'+x.b.label+
      '<span class="mono sub" style="float:right">'+money(x.total)+'</span></span>';
  });
  if(other>0) h += '<span><i style="background:#565C72"></i>Other, '+otherN+' more'+
    '<span class="mono sub" style="float:right">'+money(other)+'</span></span>';
  h += '</div></div>';

  h += '<div class="card" style="padding:15px;margin-bottom:16px">'+
    '<div class="sub" style="font-size:12px;margin-bottom:11px">Who spent what</div>'+
    '<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px">'+
    '<div style="width:'+(you/(you+fr||1)*100)+'%;background:var(--teal)"></div>'+
    '<div style="flex:1;background:var(--purple)"></div></div>'+
    '<div class="row" style="margin-top:11px;gap:18px;font-size:12.5px">'+
    '<span><i style="background:var(--teal);width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px"></i>You <span class="mono sub">'+money(you)+'</span></span>'+
    '<span><i style="background:var(--purple);width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px"></i>Friend <span class="mono sub">'+money(fr)+'</span></span>'+
    '</div></div>';

  h += '<div style="font-size:13px;font-weight:600;margin-bottom:11px">By category</div>';
  r.forEach(function(x){
    var pct = x.total/sp*100;
    h += '<div style="margin-bottom:11px"><div class="row" style="gap:9px;margin-bottom:6px">'+
      '<i style="background:'+x.b.hex+';width:9px;height:9px;border-radius:3px;display:inline-block"></i>'+
      '<span style="font-size:13px">'+x.b.label+'</span>'+
      '<span class="mono" style="margin-left:auto;font-size:13px">'+money(x.total)+'</span>'+
      '<span class="sub" style="font-size:11.5px;width:36px;text-align:right">'+Math.round(pct)+'%</span></div>'+
      '<div class="track" style="height:7px"><div class="fill" style="width:'+pct+'%;background:'+x.b.hex+'"></div></div></div>';
  });
  return h;
}

function sheetHTML(){
  var d = state.draft;
  var h = '<div style="width:38px;height:4px;background:var(--cardBorder);border-radius:2px;margin:0 auto 18px"></div>'+
    '<div style="font-size:16px;font-weight:600;margin-bottom:16px">Add a spend</div>'+
    '<label>Amount</label><input id="dAmt" inputmode="decimal" placeholder="0.00" value="'+d.amount+'">'+
    '<div style="height:12px"></div><label>Place</label><input id="dPlace" placeholder="Blue Bottle" value="'+d.place+'">'+
    '<div style="height:12px"></div><label>Category</label><select id="dBucket">';
  BUCKETS.forEach(function(b){h += '<option value="'+b.id+'"'+(b.id===d.bucket?' selected':'')+'>'+b.label+'</option>'});
  h += '</select><div style="height:12px"></div><label>Who paid</label><div class="seg">'+
    '<button onclick="setPerson(\'you\')" class="'+(d.person==='you'?'on':'')+'" style="'+
      (d.person==='you'?'background:var(--teal);color:var(--tealInk)':'')+'">You</button>'+
    '<button onclick="setPerson(\'friend\')" class="'+(d.person==='friend'?'on':'')+'" style="'+
      (d.person==='friend'?'background:var(--purple);color:var(--purpleInk)':'')+'">Friend</button></div>'+
    '<button class="primary" onclick="save()">Add to July '+state.day+'</button>'+
    '<button class="ghost" onclick="closeSheet()">Cancel</button>';
  return h;
}

var ICONS={
  home:'<path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/>',
  log:'<rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M8 3.5v4M16 3.5v4M3.5 10.5h17"/>',
  budget:'<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="17" cy="15" r="1.1" fill="currentColor" stroke="none"/>',
  stats:'<path d="M5.5 20v-7M12 20V5M18.5 20v-10"/>'
};
function tabBtn(id,label){
  return '<button class="'+(state.tab===id?'on':'')+'" onclick="go(&#39;'+id+'&#39;)" aria-label="'+label+'">'+
    '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[id]+'</svg>'+label+'</button>';
}
function render(){
  var v = document.getElementById('view');
  v.innerHTML = state.tab==='home'?home():state.tab==='log'?log():state.tab==='budget'?budget():stats();
  var n = '';
  n += tabBtn('home','Home')+tabBtn('log','Log');
  n += '<div style="width:60px;flex:none"></div>';
  n += tabBtn('budget','Budget')+tabBtn('stats','Stats');
  n += '<button class="fab" onclick="openSheet()">+</button>';
  document.getElementById('nav').innerHTML = n;
  document.getElementById('sheet').className = 'sheet'+(state.sheet?' open':'');
  if(state.sheet) document.getElementById('sheetInner').innerHTML = sheetHTML();
  readout();
}
function readout(){
  var mp = monthPace(), sp = spent(), cap = capTotal();
  var flagged = 0;
  BUCKETS.forEach(function(b){
    var st = paceState(totals()[b.id]||0,CAPS[b.id],b.cadence);
    if(st.kind==='over'||st.kind==='drift') flagged++;
  });
  var ex = document.getElementById('excludeFixed').checked;
  document.getElementById('readout').innerHTML =
    kv('Total spent',money(sp))+kv('Total cap',money(cap))+
    kv(ex?'Variable spent':'Pace basis',money(mp.spent))+
    kv('Expected by now',money(mp.cap*state.day/DIM))+
    kv('Pace ratio',(mp.cap>0?(mp.spent/(mp.cap*state.day/DIM)).toFixed(2):'—')+'×')+
    kv('Month state',mp.state.kind)+
    kv('Categories flagged',flagged+' of 8');
  document.getElementById('dayHint').textContent =
    state.day<5 ? 'Guards active — pace is suppressed this early.' :
    'Showing '+live().length+' of '+state.entries.length+' entries.';
}
function kv(k,v){return '<div class="kv"><span>'+k+'</span><span>'+v+'</span></div>'}

function go(t){state.tab=t;render()}
function openSheet(){state.sheet=true;render()}
function closeSheet(){state.sheet=false;state.draft={amount:'',place:'',bucket:'food',person:'you'};render()}
function setPerson(p){
  state.draft.amount=document.getElementById('dAmt').value;
  state.draft.place=document.getElementById('dPlace').value;
  state.draft.bucket=document.getElementById('dBucket').value;
  state.draft.person=p;render();
}
function save(){
  var amt = parseFloat(document.getElementById('dAmt').value);
  if(!amt||amt<=0){document.getElementById('dAmt').focus();return}
  var b = document.getElementById('dBucket').value;
  var pl = document.getElementById('dPlace').value.trim() || bucket(b).label;
  var maxId = state.entries.reduce(function(m,e){return Math.max(m,e.id)},0);
  state.entries.push({id:maxId+1,day:state.day,place:pl,bucket:b,amount:amt,person:state.draft.person});
  closeSheet();
}
function del(id){state.entries=state.entries.filter(function(e){return e.id!==id});render()}

document.getElementById('day').oninput = function(){
  state.day = +this.value; document.getElementById('dayOut').textContent = state.day; render();
};
['excludeFixed','guards','oldCues'].forEach(function(id){
  document.getElementById(id).onchange = render;
});
document.getElementById('reseed').onclick = function(){state.entries=seed('normal',Math.floor(Math.random()*9999));render()};
document.getElementById('blowout').onclick = function(){state.entries=seed('blowout',7);render()};
document.getElementById('frugal').onclick = function(){state.entries=seed('frugal',7);render()};

state.entries = seed('normal',7);
render();
</script>
</body>
</html>
